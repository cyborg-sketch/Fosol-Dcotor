<!DOCTYPE html>

<html lang="bn"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;font-family:'Noto Sans Bengali','Noto Sans',sans-serif;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-tint": "#1f6c3a", "outline-variant": "#bfc9bd", "surface-container": "#e6eeff", "tertiary": "#004943", "inverse-primary": "#8bd79b", "surface": "#f8f9ff", "surface-bright": "#f8f9ff", "error-container": "#ffdad6", "on-primary-container": "#93e0a2", "on-error-container": "#93000a", "primary-fixed-dim": "#8bd79b", "on-primary-fixed-variant": "#005226", "tertiary-fixed": "#89f5e7", "on-secondary-fixed-variant": "#6e3900", "on-tertiary-fixed": "#00201d", "on-primary": "#ffffff", "on-primary-fixed": "#00210b", "on-surface-variant": "#404940", "on-error": "#ffffff", "secondary-fixed": "#ffdcc3", "on-background": "#121c2a", "secondary-container": "#fe932c", "surface-container-highest": "#d9e3f6", "tertiary-fixed-dim": "#6bd8cb", "on-secondary-fixed": "#2f1500", "inverse-surface": "#27313f", "primary": "#004c22", "secondary-fixed-dim": "#ffb77d", "inverse-on-surface": "#eaf1ff", "outline": "#707a6f", "primary-fixed": "#a6f4b5", "on-tertiary-fixed-variant": "#005049", "on-secondary": "#ffffff", "tertiary-container": "#00635b", "surface-container-low": "#eff4ff", "error": "#ba1a1a", "primary-container": "#166534", "surface-variant": "#d9e3f6", "surface-container-lowest": "#ffffff", "secondary": "#904d00", "on-tertiary-container": "#73e0d2", "on-secondary-container": "#663500", "background": "#f8f9ff", "on-surface": "#121c2a", "surface-container-high": "#dee9fc", "surface-dim": "#d0dbed", "on-tertiary": "#ffffff" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "spacing-20": "1.25rem", "spacing-24": "1.5rem", "screen-margin-mobile": "1rem", "spacing-48": "3rem", "spacing-32": "2rem", "spacing-8": "0.5rem", "spacing-12": "0.75rem", "touch-target-min": "3.25rem", "card-padding": "1.25rem", "spacing-16": "1rem", "spacing-4": "0.25rem", "spacing-40": "2.5rem" }, "fontFamily": { "body-md": ["Noto Sans"], "body-lg": ["Noto Sans"], "display-lg": ["Noto Sans"], "headline-lg": ["Noto Sans"], "headline-sm": ["Noto Sans"], "headline-md": ["Noto Sans"], "body-sm": ["Noto Sans"], "label-md": ["Noto Sans"], "label-lg": ["Noto Sans"], "label-sm": ["Noto Sans"] }, "fontSize": { "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }], "display-lg": ["32px", { "lineHeight": "44px", "fontWeight": "700" }], "headline-lg": ["26px", { "lineHeight": "36px", "fontWeight": "700" }], "headline-sm": ["18px", { "lineHeight": "26px", "fontWeight": "600" }], "headline-md": ["22px", { "lineHeight": "32px", "fontWeight": "600" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "label-md": ["14px", { "lineHeight": "18px", "fontWeight": "600" }], "label-lg": ["16px", { "lineHeight": "22px", "fontWeight": "700" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen"><main class="flex flex-col relative w-full pt-safe pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full relative select-none">
<!-- Viewfinder Stage -->
<div class="relative w-full rounded-2xl overflow-hidden bg-surface-container shadow-xl aspect-[3/4] max-h-[580px] flex flex-col justify-between p-4">
<!-- Camera Simulated Optical Live Feed Background -->
<img class="absolute inset-0 w-full h-full object-cover z-0" data-alt="Macro photorealistic close-up of a diseased paddy rice leaf in a rural Bangladesh field, displaying distinct brown leaf blast lesions and spots with yellow halos. Bright natural daylight illuminates the dewy green leaf veins, clear textured detail, outdoor agricultural background softly blurred with lush greenery." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBU0KEmjguH-393-QsK8_6uedkORh1HfzJEYzTzt03LI1pBjbqeCGD8tB1saJyvSYYP7GfI82E634dLBt5B-Y_8aAR0iEJ06eqPYNt18X4jqOJ1zMwFYZO64P2KlGKlt3JFzKKCShqNQviyMl93Cn-G8yFkZkdVUriYLw8DRSvW_R_SK0rIebVa3dhL-ZBXpMzk4DjOCK5CER2_c8hNdWeKUxJR0VCguD3ydLZNG3wiABLrxvo9o8Y"/>
<!-- Ambient Dark Vignette Scrim for outdoor sunlight contrast -->
<div class="absolute inset-0 bg-gradient-to-b from-on-background/70 via-transparent to-on-background/80 z-10 pointer-events-none"></div>
<!-- Top Status & Audio Bar -->
<div class="relative z-20 flex items-center justify-between gap-2 w-full pt-1">
<!-- High Contrast Guidance Pill -->
<div class="flex items-center gap-2 bg-on-background/85 px-3 py-2 rounded-full shadow-md backdrop-blur-sm max-w-[80%]">
<span class="material-symbols-outlined text-primary-fixed text-[20px] shrink-0">spa</span>
<span class="font-label-sm text-label-sm text-on-primary font-medium truncate">পাতা বা ফসলটি ফ্রেমের মাঝে রাখুন</span>
</div>
<!-- Voice Assist Trigger -->
<button aria-label="কণ্ঠ সহায়তা শুনুন" class="h-11 w-11 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shadow-lg active:scale-95 transition-transform" id="audioBtn" type="button">
<span class="material-symbols-outlined text-[24px]">volume_up</span>
</button>
</div>
<!-- Active Center Aiming Reticle with Pulsing Diagnostic Sensor Rings -->
<div class="relative z-20 flex-1 flex flex-col items-center justify-center">
<!-- Focusing Box Container -->
<div class="relative w-56 h-56 sm:w-64 sm:h-64 flex items-center justify-center">
<!-- High-Vis Organic Aiming Corners (SVG without borders) -->
<svg class="absolute inset-0 w-full h-full text-primary-fixed drop-shadow-md" fill="none" viewbox="0 0 240 240">
<!-- Top Left Corner -->
<path d="M 12 44 L 12 20 C 12 15.58 15.58 12 20 12 L 44 12" stroke="currentColor" stroke-linecap="round" stroke-width="4.5"></path>
<!-- Top Right Corner -->
<path d="M 196 12 L 220 12 C 224.42 12 228 15.58 228 20 L 228 44" stroke="currentColor" stroke-linecap="round" stroke-width="4.5"></path>
<!-- Bottom Left Corner -->
<path d="M 12 196 L 12 220 C 12 224.42 15.58 228 20 228 L 44 228" stroke="currentColor" stroke-linecap="round" stroke-width="4.5"></path>
<!-- Bottom Right Corner -->
<path d="M 196 228 L 220 228 C 224.42 228 228 224.42 228 220 L 228 196" stroke="currentColor" stroke-linecap="round" stroke-width="4.5"></path>
</svg>
<!-- Dynamic Sensor Center Ring -->
<div class="w-24 h-24 rounded-full bg-primary-fixed/20 flex items-center justify-center animate-pulse transition-all duration-300" id="sensorRing">
<div class="w-3 h-3 rounded-full bg-primary-fixed shadow-sm"></div>
</div>
<!-- Detection Marker Flag -->
<div class="absolute -bottom-3 bg-primary text-on-primary px-3 py-1 rounded-full shadow-lg flex items-center gap-1.5 animate-bounce">
<span class="material-symbols-outlined text-[16px] text-primary-fixed" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-sm text-label-sm">রোগের লক্ষণ শনাক্ত হয়েছে</span>
</div>
</div>
</div>
<!-- Live Ambient Feedback Status Pill -->
<div class="relative z-20 flex justify-center pb-2">
<div class="flex items-center gap-2 bg-on-background/90 px-4 py-2 rounded-full shadow-md" id="conditionPill">
<span class="material-symbols-outlined text-primary-fixed text-[18px]">verified</span>
<span class="font-label-sm text-label-sm text-on-primary">ছবিটি পরিষ্কার ও স্পষ্ট আলোতে আছে</span>
</div>
</div>
</div>
<!-- Camera Action Panel (Bottom 45% Thumb Zone) -->
<div class="flex flex-col w-full bg-surface px-4 pt-5 pb-3">
<!-- Main Tactile Control Buttons -->
<div class="flex items-center justify-around w-full max-w-sm mx-auto">
<!-- Gallery Select Button -->
<button aria-label="গ্যালারি থেকে ছবি বাছাই করুন" class="flex flex-col items-center justify-center gap-1 min-w-[64px] min-h-[64px] rounded-2xl bg-surface-container active:bg-surface-container-high text-on-surface shadow-sm active:scale-95 transition-transform" id="galleryBtn" type="button">
<span class="material-symbols-outlined text-[28px] text-primary">photo_library</span>
<span class="font-label-sm text-label-sm font-semibold">গ্যালারি</span>
</button>
<!-- Huge Prominent Shutter Button (76px diameter thumb hit) -->
<button aria-label="ছবি তুলুন" class="relative flex items-center justify-center w-[84px] h-[84px] rounded-full bg-surface-container-lowest shadow-xl active:scale-90 transition-all duration-150 group" id="shutterBtn" type="button">
<!-- Outer Track Ring -->
<div class="w-[74px] h-[74px] rounded-full bg-surface-container flex items-center justify-center">
<!-- Tactile Primary Shutter Core -->
<div class="w-[62px] h-[62px] rounded-full bg-primary flex items-center justify-center group-active:bg-primary-container shadow-md">
<span class="material-symbols-outlined text-on-primary text-[32px]">photo_camera</span>
</div>
</div>
</button>
<!-- Flash Toggle Button -->
<button aria-label="ক্যামেরা ফ্ল্যাশ আলো চালু অথবা বন্ধ করুন" class="flex flex-col items-center justify-center gap-1 min-w-[64px] min-h-[64px] rounded-2xl bg-surface-container active:bg-surface-container-high text-on-surface shadow-sm active:scale-95 transition-transform" id="flashBtn" type="button">
<span class="material-symbols-outlined text-[28px] text-secondary" id="flashIcon">flash_off</span>
<span class="font-label-sm text-label-sm font-semibold" id="flashText">ফ্ল্যাশ</span>
</button>
</div>
<!-- Farmer Educational Do's & Don'ts Footnote Card -->
<div class="mt-5 w-full bg-surface-container-low rounded-xl p-3.5 flex items-center gap-3 shadow-sm">
<div class="w-9 h-9 rounded-full bg-error-container text-on-error-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[20px]">info</span>
</div>
<div class="flex flex-col min-w-0">
<p class="font-label-md text-label-md text-on-surface font-semibold truncate">অস্পষ্ট বা দূরে থেকে ছবি তুলবেন না</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">সঠিক সমাধানের জন্য আক্রান্ত পাতার খুব কাছে আনুন</p>
</div>
</div>
</div>
</div>
<script>
  // Camera Control Logic & Micro-delights
  const shutterBtn = document.getElementById('shutterBtn');
  const flashBtn = document.getElementById('flashBtn');
  const flashIcon = document.getElementById('flashIcon');
  const conditionPill = document.getElementById('conditionPill');
  const sensorRing = document.getElementById('sensorRing');
  const audioBtn = document.getElementById('audioBtn');

  let flashActive = false;
  let audioPlaying = false;

  // Flash Toggle Feedback
  flashBtn?.addEventListener('click', () => {
    flashActive = !flashActive;
    if (flashActive) {
      flashIcon.textContent = 'flash_on';
      flashIcon.classList.remove('text-secondary');
      flashIcon.classList.add('text-secondary-container');
      conditionPill.innerHTML = `
        <span class="material-symbols-outlined text-secondary-container text-[18px]">bolt</span>
        <span class="font-label-sm text-label-sm text-on-primary">ফ্ল্যাশ আলো চালু হয়েছে</span>
      `;
    } else {
      flashIcon.textContent = 'flash_off';
      flashIcon.classList.add('text-secondary');
      flashIcon.classList.remove('text-secondary-container');
      conditionPill.innerHTML = `
        <span class="material-symbols-outlined text-primary-fixed text-[18px]">verified</span>
        <span class="font-label-sm text-label-sm text-on-primary">ছবিটি পরিষ্কার ও স্পষ্ট আলোতে আছে</span>
      `;
    }
  });

  // Shutter Snapshot Haptic Simulation
  shutterBtn?.addEventListener('click', () => {
    sensorRing.classList.add('scale-125', 'bg-primary-fixed/60');
    conditionPill.innerHTML = `
      <span class="material-symbols-outlined text-primary-fixed text-[18px]">hourglass_top</span>
      <span class="font-label-sm text-label-sm text-on-primary">ছবি যাচাই করা হচ্ছে...</span>
    `;
    setTimeout(() => {
      sensorRing.classList.remove('scale-125', 'bg-primary-fixed/60');
      conditionPill.innerHTML = `
        <span class="material-symbols-outlined text-primary-fixed text-[18px]">check_circle</span>
        <span class="font-label-sm text-label-sm text-on-primary">পাতার রোগ বিশ্লেষণ সফল</span>
      `;
    }, 600);
  });

  // Audio Voice Prompt Simulation
  audioBtn?.addEventListener('click', () => {
    audioPlaying = !audioPlaying;
    if (audioPlaying) {
      audioBtn.classList.add('scale-110');
      conditionPill.innerHTML = `
        <span class="material-symbols-outlined text-secondary-container text-[18px]">hearing</span>
        <span class="font-label-sm text-label-sm text-on-primary">পরামর্শ শোনা যাচ্ছে...</span>
      `;
      setTimeout(() => {
        audioPlaying = false;
        audioBtn.classList.remove('scale-110');
        conditionPill.innerHTML = `
          <span class="material-symbols-outlined text-primary-fixed text-[18px]">verified</span>
          <span class="font-label-sm text-label-sm text-on-primary">ছবিটি পরিষ্কার ও স্পষ্ট আলোতে আছে</span>
        `;
      }, 2500);
    }
  });
</script></main></body></html>
