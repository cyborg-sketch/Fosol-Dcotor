name: fasol_doctor
description: Fasol Doctor — crop disease diagnosis for smallholder farmers.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  http_parser: ^4.0.2
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5
  go_router: ^14.2.7
  flutter_riverpod: ^2.6.1
  tflite_flutter: ^0.11.0
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
